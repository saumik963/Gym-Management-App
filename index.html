<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>Fitness Care Gym</title>
    <meta name="description" content="100% offline-first Gym Member Management PWA for managing members, monthly fees, collections, dues, and reports." />
    <meta property="og:title" content="Fitness Care Gym" />
    <meta property="og:description" content="100% offline-first Gym Member Management PWA for managing members, monthly fees, collections, dues, and reports." />
    <link rel="icon" type="image/jpeg" href="/logo.webp" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
